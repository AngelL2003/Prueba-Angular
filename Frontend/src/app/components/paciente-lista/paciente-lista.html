<h1>Lista Pacientes</h1>
<div *ngFor="let paciente of pacientes()">
    <p>
        <strong>Id:</strong>{{paciente.id}}
    </p>
    <p>
        <strong>Tipo de documento</strong>{{paciente.tipoDocumento}}
    </p>
    <p>
        <strong>Numero de documento</strong>{{paciente.numeroDocumento}}
    </p>
</div>
